# SysTick on CH585/CH584/CH581 (QingKe V3C): 32 bits, unlike the 64-bit
# SysTick of CH583/CH592 (systick_ch583.yaml). The CH585 EVT's core_riscv.h
# has a uint32_t CNT at 0x08 and CMP at 0x10, with 0x0C and 0x14 reserved; on
# a CH584 those two read 0 and ignore writes.
block/Systick:
  description: Systick register.
  items:
  - name: STK_CTLR
    description: Systick counter control register.
    byte_offset: 0
    fieldset: STK_CTLR
  - name: STK_SR
    description: Systick count status register.
    byte_offset: 4
    fieldset: STK_SR
  - name: STK_CNTL
    description: Systick counter low register.
    byte_offset: 8
    fieldset: STK_CNTL
  - name: STK_CMPLR
    description: Systick compare low register.
    byte_offset: 16
    fieldset: STK_CMPLR
fieldset/STK_CMPLR:
  description: Systick compare low register.
  fields:
  - name: CMPL
    description: RW,CMPL.
    bit_offset: 0
    bit_size: 32
fieldset/STK_CNTL:
  description: Systick counter low register.
  fields:
  - name: CNTL
    description: RW,CNTL.
    bit_offset: 0
    bit_size: 32
fieldset/STK_CTLR:
  description: Systick counter control register.
  fields:
  - name: STE
    description: Systick counter enable.
    bit_offset: 0
    bit_size: 1
  - name: STIE
    description: Systick counter interrupt enable.
    bit_offset: 1
    bit_size: 1
  - name: STCLK
    description: System counter clock Source selection.
    bit_offset: 2
    bit_size: 1
  - name: STRE
    description: System counter reload control.
    bit_offset: 3
    bit_size: 1
  - name: MODE
    description: counter mode.
    bit_offset: 4
    bit_size: 1
  - name: INIT
    description: Initial counter value updated.
    bit_offset: 5
    bit_size: 1
  - name: SWIE
    description: RW0,System soft interrupt enable.
    bit_offset: 31
    bit_size: 1
fieldset/STK_SR:
  description: Systick count status register.
  fields:
  - name: CNTIF
    description: RW,CNTIF.
    bit_offset: 0
    bit_size: 1
