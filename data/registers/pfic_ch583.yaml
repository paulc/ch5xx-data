# IPRIOR is one 8-bit priority per interrupt number at 0x400 + n, 256 of them
# (vendor core_riscv.h: `uint8_t IPRIOR[256]` at 400H; qingke::pfic writes
# single bytes there). The vendor SVD listed 64 32-bit IPRIORx registers 0x20
# apart, which put IPRIOR1.. at addresses that hold priorities for IRQ 32 and up.
block/PFIC:
  description: Program Fast Interrupt Controller.
  items:
  - name: ISR1
    description: RO,Interrupt Status Register 1.
    byte_offset: 0
    access: Read
    fieldset: ISR1
  - name: ISR2
    description: RO,Interrupt Status Register 2.
    byte_offset: 4
    access: Read
    fieldset: ISR2
  - name: IPR1
    description: RO,Interrupt Pending Register 1.
    byte_offset: 32
    access: Read
    fieldset: IPR1
  - name: IPR2
    description: RO,Interrupt Pending Register 2.
    byte_offset: 36
    access: Read
    fieldset: IPR2
  - name: ITHRESDR
    description: RW,Interrupt Priority Register.
    byte_offset: 64
    fieldset: ITHRESDR
  - name: CFGR
    description: Interrupt Config Register.
    byte_offset: 72
    access: Write
    fieldset: CFGR
  - name: GISR
    description: Interrupt Global Register.
    byte_offset: 76
    access: Read
    fieldset: GISR
  - name: IDCFGR
    description: RW,Interrupt Fast ID Config Register.
    byte_offset: 80
    fieldset: IDCFGR
  - name: FIADDRR0
    description: Interrupt 0 address Register.
    byte_offset: 96
    fieldset: FIADDRR0
  - name: FIADDRR1
    description: Interrupt 1 address Register.
    byte_offset: 100
    fieldset: FIADDRR1
  - name: FIADDRR2
    description: Interrupt 2 address Register.
    byte_offset: 104
    fieldset: FIADDRR2
  - name: FIADDRR3
    description: Interrupt 3 address Register.
    byte_offset: 108
    fieldset: FIADDRR3
  - name: IENR1
    description: Interrupt Setting Register.
    byte_offset: 256
    access: Write
    fieldset: IENR1
  - name: IENR2
    description: Interrupt Setting Register.
    byte_offset: 260
    access: Write
    fieldset: IENR2
  - name: IRER1
    description: Interrupt Clear Register.
    byte_offset: 384
    access: Write
    fieldset: IRER1
  - name: IRER2
    description: Interrupt Clear Register.
    byte_offset: 388
    access: Write
    fieldset: IRER2
  - name: IPSR1
    description: Interrupt Pending Register.
    byte_offset: 512
    access: Write
    fieldset: IPSR1
  - name: IPSR2
    description: Interrupt Pending Register.
    byte_offset: 516
    access: Write
    fieldset: IPSR2
  - name: IPRR1
    description: Interrupt Pending Clear Register.
    byte_offset: 640
    access: Write
    fieldset: IPRR1
  - name: IPRR2
    description: Interrupt Pending Clear Register.
    byte_offset: 644
    access: Write
    fieldset: IPRR2
  - name: IACTR1
    description: Interrupt ACTIVE Register.
    byte_offset: 768
    fieldset: IACTR1
  - name: IACTR2
    description: Interrupt ACTIVE Register.
    byte_offset: 772
    fieldset: IACTR2
  - name: IPRIOR
    description: RW, Interrupt priority, one byte per interrupt number.
    byte_offset: 1024
    bit_size: 8
    array:
      len: 256
      stride: 1
  - name: SCTLR
    description: System Control Register.
    byte_offset: 3344
    fieldset: SCTLR
fieldset/CFGR:
