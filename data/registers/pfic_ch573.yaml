# IPRIOR is one 8-bit priority per interrupt number at 0x400 + n, 256 of them
# (vendor core_riscv.h: `uint8_t IPRIOR[256]` at 400H; qingke::pfic writes
# single bytes there). The vendor SVD listed 64 32-bit IPRIORx registers 0x20
# apart, which put IPRIOR1.. at addresses that hold priorities for IRQ 32 and up.
block/PFIC:
  description: Program Fast Interrupt Controller.
  items:
  - name: ISR1
    description: RO,Interrupt Status Register.
    byte_offset: 0
    fieldset: ISR1
  - name: ISR2
    description: RO,Interrupt Status Register.
    byte_offset: 4
    fieldset: ISR2
  - name: IPR1
    description: RO,Interrupt Pending Register.
    byte_offset: 32
    fieldset: IPR1
  - name: IPR2
    description: RO,Interrupt Pending Register.
    byte_offset: 36
    access: Read
    fieldset: IPR2
  - name: ITHRESDR
    description: RW,Interrupt Priority Register.
    byte_offset: 64
    fieldset: ITHRESDR
  - name: FIBADDRR
    description: RW,Interrupt Fast Address Register.
    byte_offset: 68
    fieldset: FIBADDRR
  - name: CFGR
    description: Interrupt Config Register.
    byte_offset: 72
    fieldset: CFGR
  - name: GISR
    description: Interrupt Global Register.
    byte_offset: 76
    access: Read
    fieldset: GISR
  - name: FIFOADDRR0
    description: Interrupt 0 address Register.
    byte_offset: 96
    fieldset: FIFOADDRR0
  - name: FIFOADDRR1
    description: Interrupt 1 address Register.
    byte_offset: 100
    fieldset: FIFOADDRR1
  - name: FIFOADDRR2
    description: Interrupt 2 address Register.
    byte_offset: 104
    fieldset: FIFOADDRR2
  - name: FIFOADDRR3
    description: Interrupt 3 address Register.
    byte_offset: 108
    fieldset: FIFOADDRR3
  - name: IENR1
    description: Interrupt Setting Register.
    byte_offset: 256
    fieldset: IENR1
  - name: IENR2
    description: Interrupt Setting Register.
    byte_offset: 260
    fieldset: IENR2
  - name: IRER1
    description: Interrupt Clear Register.
    byte_offset: 384
    fieldset: IRER1
  - name: IRER2
    description: Interrupt Clear Register.
    byte_offset: 388
    fieldset: IRER2
  - name: IPSR1
    description: Interrupt Pending Register.
    byte_offset: 512
    fieldset: IPSR1
  - name: IPSR2
    description: Interrupt Pending Register.
    byte_offset: 516
    fieldset: IPSR2
  - name: IPRR1
    description: Interrupt Pending Clear Register.
    byte_offset: 640
    fieldset: IPRR1
  - name: IPRR2
    description: Interrupt Pending Clear Register.
    byte_offset: 644
    fieldset: IPRR2
  - name: IACTR1
    description: Interrupt ACTIVE Register.
    byte_offset: 768
    fieldset: IACTR1
  - name: IACTR2
    description: Interrupt ACTIVE Register.
    byte_offset: 772
    fieldset: IACTR2
  - name: IPRIOR
    description: RW, Interrupt priority, one byte per interrupt number.
    byte_offset: 1024
    bit_size: 8
    array:
      len: 256
      stride: 1
  - name: SCTLR
    description: System Control Register.
    byte_offset: 3344
    fieldset: SCTLR
  - name: VTCTLR
    description: System Control Register.
    byte_offset: 3348
    fieldset: VTCTLR
