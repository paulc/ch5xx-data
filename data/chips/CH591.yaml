# CH591, from the CH592/CH591 datasheet V1.9 (CH592DS1) and the CH591
# templates in the EVT v1.7 SDK, which ship the CH592 SFR header and ISP
# library unchanged; only the linker script differs, cutting code flash from
# 448KB to 192KB. SRAM stays 26KB. R8_CHIP_ID reads 0x91.
#
# The DS gives CH591 192KB CodeFlash + 24KB BootLoader + 32KB DataFlash and a
# 256KB FlashROM in total, but its address table only covers the 512KB CH592
# layout, so the DataFlash address is not known and it is not mapped here.
# CodeFlash geometry follows ISP592.h, as on CH592.
#
# Peripherals differ from CH592 (no TouchKey, no I2C, two UARTs), so CH591 has
# its own family list.
name: CH591
family: QingKe RISC-V-based, BLE MCU
subfamily: RISC-V Core BLE Wireless MCU
product_type: QingKe V4C core, BLE
packages:
  - name: CH591D
    package: QFN20
    device_id: 0x91000000
  - name: CH591F
    package: QFN28
    device_id: 0x91000000
  - name: CH591R
    package: TSSOP16
    device_id: 0x91000000
memory:
  - name: CODEFLASH
    kind: flash
    address: 0
    size: 192K
    modes:
      - type: standard
        erase_size: 4K
        write_size: 4
  - name: SRAM
    kind: ram
    address: 0x20000000
    size: 26K
docs:
  - type: datasheet
    title: CH592/CH591 datasheet
    name: CH592DS1 V1.9
    url: https://www.wch.cn/downloads/CH592DS1_PDF.html
  - type: homepage
    title: CH591 product page
    name: ""
    url: https://www.wch.cn/products/CH591.html
cores:
  - name: qingke-v4c
    arch: riscv
    peripherals: []
    include_peripherals:
      - "../family/CH591.yaml"
    include_interrupts: "../interrupts/CH592.yaml"
